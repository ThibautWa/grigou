name: Deploy Grigou to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  WORKING_DIRECTORY: './app'

jobs:
  # ============================================
  # JOB 1: Tests & Build Validation
  # ============================================
  test:
    name: Tests & Quality Checks
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint || echo "⚠️ Lint warnings (non-blocking)"
        continue-on-error: true

      - name: 🏗️ Type check
        run: npx tsc --noEmit || echo "⚠️ Type errors (non-blocking)"
        continue-on-error: true

      - name: 🏗️ Build test
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          NEXTAUTH_SECRET: test-secret-key-min-32-chars-long-for-build
          NEXTAUTH_URL: http://localhost:3000

      - name: ✅ Tests completed
        run: echo "✅ All checks completed!"

  # ============================================
  # JOB 2: Deploy to Production VPS
  # ============================================
  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to Production
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash << 'ENDSSH'
            set -e
            APP_DIR="${{ secrets.APP_DIR }}"
            COMPOSE="docker compose -f docker-compose.prod.yml"
            DASHBOARDS_DIR=/opt/monitoring/grafana/provisioning/dashboards/grigou
            cd "$APP_DIR"

            # ---- Code ----------------------------------------------------------
            OLD=$(git rev-parse HEAD)
            git fetch origin
            git reset --hard origin/main
            NEW=$(git rev-parse HEAD)
            echo "Code: ${OLD:0:7} -> ${NEW:0:7}"
            CHANGED=$(git diff --name-only "$OLD" "$NEW" || true)
            echo "$CHANGED" | sed 's/^/  /'

            # Only rebuild the application when something it is built from changed
            # (monitoring dashboards, docs and CI files don't need a new image).
            APP_CHANGED=$(echo "$CHANGED" | grep -vE '^(monitoring/|\.github/|.*\.md$)' | grep -vE '^docker/(nginx|grigou)\.conf$' || true)
            NGINX_CHANGED=$(echo "$CHANGED" | grep -E '^docker/(nginx|grigou)\.conf$' || true)
            DASH_CHANGED=$(echo "$CHANGED" | grep -E '^monitoring/dashboards/' || true)

            # ---- Monitoring dashboards (Grafana reloads them by itself) ----------
            if [ -n "$DASH_CHANGED" ] && [ -d "$DASHBOARDS_DIR" ]; then
              cp monitoring/dashboards/*.json "$DASHBOARDS_DIR"/
              echo "Grafana dashboards updated"
            fi

            # ---- Application: build while the site keeps running, then swap ---
            if [ -n "$APP_CHANGED" ] || [ "$OLD" = "$NEW" ]; then
              set -a; source .env.production; set +a
              mkdir -p backups
              BACKUP_FILE="backups/db-backup-$(date +%Y%m%d-%H%M%S).sql"
              if docker exec grigou_db pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" > "$BACKUP_FILE"; then
                echo "Backup: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"
              else
                echo "Backup failed (non-blocking)"; rm -f "$BACKUP_FILE"
              fi
              ls -t backups/db-backup-*.sql 2>/dev/null | tail -n +6 | xargs -r rm

              echo "Building the new image (site still online)..."
              $COMPOSE build app
              # Recreates only the containers whose image or config changed (here: the app);
              # the database and nginx keep running.
              $COMPOSE up -d
              for i in $(seq 1 30); do
                STATUS=$(docker inspect -f '{{.State.Health.Status}}' grigou_app 2>/dev/null || echo starting)
                [ "$STATUS" = healthy ] && break
                sleep 3
              done
              echo "App: $STATUS"
              [ "$STATUS" = healthy ] || { docker logs --tail 50 grigou_app; exit 1; }
              docker image prune -f > /dev/null || true
            else
              echo "No application change: no rebuild, no restart"
            fi

            # ---- nginx: test the new config, then recreate nginx (a few seconds) ---
            if [ -n "$NGINX_CHANGED" ]; then
              # Same mounts and networks as the real nginx container
              $COMPOSE run --rm --no-deps nginx nginx -t \
                && $COMPOSE up -d --force-recreate --no-deps nginx \
                || { echo "Invalid nginx config: nginx NOT restarted"; exit 1; }
            fi

            $COMPOSE ps
          ENDSSH

      - name: 🧪 Health Check
        run: |
          echo "⏳ Waiting 10 seconds before health check..."
          sleep 10
          
          echo "🔍 Checking application health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.PRODUCTION_DOMAIN }}/api/health || echo "000")
          
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ] || [ "$HTTP_STATUS" = "307" ]; then
            echo "✅ Application is healthy (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ Health check returned HTTP $HTTP_STATUS"
            echo "This is not critical - application might still be starting"
          fi

      - name: 📢 Deployment Success
        if: success()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 Deployment completed successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌐 Application URL: https://${{ secrets.PRODUCTION_DOMAIN }}"
          echo "📦 Commit SHA: ${{ github.sha }}"
          echo "👤 Deployed by: ${{ github.actor }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "⏰ Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📢 Deployment Failure
        if: failure()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ Deployment failed!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Check the logs above for details"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
