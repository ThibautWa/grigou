name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: Code Review Checks
    runs-on: ubuntu-latest
    # The last step posts a summary comment on the PR: the default token is read-only
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    defaults:
      run:
        working-directory: app

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      # No ESLint config in the project yet: type checking replaces linting
      - name: 🔍 Type check
        run: npx tsc --noEmit

      - name: 🏗️ Build check
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          AUTH_SECRET: test-secret-key
          NEXTAUTH_SECRET: test-secret-key
          NEXTAUTH_URL: http://localhost:3000

      # Only on success, so the comment never claims checks that failed
      - name: 📊 Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🤖 Automated PR Review\n\n✅ Type checks passed\n✅ Build successful\n\nReady for human review! 👀',
            });
